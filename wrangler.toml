# Ava Brain - Cloudflare Worker Configuration
name = "ava-brain"
main = "src/index.js"
compatibility_date = "2025-03-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "ava_brain_db"
database_id = "id"

[[kv_namespaces]]
binding = "KV"
id = "id"

[ai]
binding = "AI"

[vars]
ENVIRONMENT = "production"

[triggers]
crons = ["*/5 * * * *", "0 4 * * *"]

[observability.logs]
enabled = true
invocation_logs = true


